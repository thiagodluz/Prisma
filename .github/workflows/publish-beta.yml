name: Publish Android beta

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-beta.yml
  workflow_dispatch:

jobs:
  release:
    if: github.repository == 'thiagodluz/Prisma'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 35920635755 --repo "$GITHUB_REPOSITORY" --name Prisma-Android-debug --dir release
          mv release/app-debug.apk release/Prisma-Android.apk
          echo 'd9d6723aba6d7ba1d9f1a3a7a685ba49a58420daee093bda0e1fb2ca77550bf9  release/Prisma-Android.apk' | sha256sum --check
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2-beta.3 release/Prisma-Android.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Prisma beta 3 — Android' --prerelease --latest=false \
            --notes-file docs/release-beta.md
