name: Publish Android beta

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-beta.yml
  workflow_dispatch:

jobs:
  release:
    if: github.repository == 'thiagodluz/Prisma'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 35927540788 --repo "$GITHUB_REPOSITORY" --name Prisma-Android-debug --dir release
          mv release/app-debug.apk release/Prisma-Android.apk
          echo '390652eb18b5f7b42511510194c46e1046f67540ce1c2d64419425fd8512596d  release/Prisma-Android.apk' | sha256sum --check
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2-beta.4 release/Prisma-Android.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Prisma beta 4 — Android' --prerelease --latest=false \
            --notes-file docs/release-beta.md
