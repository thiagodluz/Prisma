name: Publish Android beta

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-beta.yml
  workflow_dispatch:

jobs:
  release:
    if: github.repository == 'thiagodluz/Prisma'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 35898001730 --repo "$GITHUB_REPOSITORY" --name Prisma-Android-debug --dir release
          mv release/app-debug.apk release/Prisma-Android.apk
          echo '982393bcdcf8dfed3d7db7f11d4bbe3b9cded6054702b3f1345fb9cae7986c6b  release/Prisma-Android.apk' | sha256sum --check
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1-beta.2 release/Prisma-Android.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Prisma beta 2 — Android' --prerelease --latest=false \
            --notes-file docs/release-beta.md
