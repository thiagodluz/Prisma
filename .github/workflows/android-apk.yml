name: Android APK
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified offline audio
        run: node scripts/download-audio.mjs
      - name: Build standalone offline HTML
        run: npm run build:offline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          test -n "$sdk_manager"
          yes | "$sdk_manager" --licenses >/dev/null
          "$sdk_manager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify game
        run: |
          npm run check:version
          npm run check:offline
          npm run check:publish-version
          npm test
      - name: Build installable APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify APK signature and bundled game
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | grep 'No errors detected'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/app.js'

  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play all bundled audio in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest --no-daemon
      - name: Upload playback test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-audio-playback-results
          path: android/app/build/reports/androidTests/connected/
