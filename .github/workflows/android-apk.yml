name: Android APK
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          test -n "$sdk_manager"
          yes | "$sdk_manager" --licenses >/dev/null
          "$sdk_manager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify game
        run: npm test
      - name: Build installable APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify APK signature and bundled game
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | grep 'No errors detected'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/app.js'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prisma-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
