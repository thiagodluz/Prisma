name: APK assinado do Mercadinho
on:
  push:
    branches: [build/mercadinho-1-0]
    paths: [.github/workflows/mercadinho-assinado.yml]
jobs:
  build:
    if: github.repository == 'thiagodluz/Prisma'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thiagodluz/Mercadinho
          ref: 865624371c5ef3e5d29165ce3d1d2f93daaa20d4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar SDK
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          test -n "$sdk_manager"
          "$sdk_manager" --licenses < <(yes) >/dev/null
          "$sdk_manager" 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Testar e preparar
        run: |
          npm ci
          npm test
          npm run android:sync
          gradle_zip="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          curl -fLsS --retry 2 --max-time 120 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/269969095?download=1' -o "$gradle_zip"
          sha=$(sed -n 's/^distributionSha256Sum=//p' android/gradle/wrapper/gradle-wrapper.properties)
          printf '%s  %s\n' "$sha" "$gradle_zip" | sha256sum -c -
          unzip -q "$gradle_zip" -d "$RUNNER_TEMP"
      - name: Preparar assinatura
        env:
          PRISMA_KEYSTORE_BASE64: ${{ secrets.PRISMA_KEYSTORE_BASE64 }}
          PRISMA_KEYSTORE_PASSWORD: ${{ secrets.PRISMA_KEYSTORE_PASSWORD }}
          PRISMA_KEY_ALIAS: ${{ secrets.PRISMA_KEY_ALIAS }}
          PRISMA_KEY_PASSWORD: ${{ secrets.PRISMA_KEY_PASSWORD }}
        run: |
          test -n "$PRISMA_KEYSTORE_BASE64" && test -n "$PRISMA_KEYSTORE_PASSWORD"
          test -n "$PRISMA_KEY_ALIAS" && test -n "$PRISMA_KEY_PASSWORD"
          umask 077
          printf '%s' "$PRISMA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/prisma-release.p12"
          test -s "$RUNNER_TEMP/prisma-release.p12"
          echo "PRISMA_KEYSTORE_FILE=$RUNNER_TEMP/prisma-release.p12" >> "$GITHUB_ENV"
      - name: Compilar APK assinado
        env:
          PRISMA_KEYSTORE_PASSWORD: ${{ secrets.PRISMA_KEYSTORE_PASSWORD }}
          PRISMA_KEY_ALIAS: ${{ secrets.PRISMA_KEY_ALIAS }}
          PRISMA_KEY_PASSWORD: ${{ secrets.PRISMA_KEY_PASSWORD }}
        run: |
          "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" -p android :app:assembleRelease --no-daemon
      - name: Verificar assinatura
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          verifier="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$verifier" verify --verbose "$apk"
          cert=$("$verifier" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')
          test "$cert" = C86E47B3A2A07CF21E7BEB971F0168BC516CA834FA0940A070C7570E66D20869
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > dados-apk.txt
          grep -F "name='br.com.thiagodluz.mercadinho'" dados-apk.txt
          grep -F "versionCode='10'" dados-apk.txt
          grep -F "versionName='1.0.0'" dados-apk.txt
          unzip -p "$apk" assets/public/index.html > jogo-empacotado.html
          grep -Fq 'pendingDrag' jogo-empacotado.html
          grep -Fq 'Modos de jogo' jogo-empacotado.html
          unzip -tq "$apk"
          cp "$apk" Mercadinho-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mercadinho-1.0.0-assinado
          path: Mercadinho-1.0.0.apk
          if-no-files-found: error
          retention-days: 90
