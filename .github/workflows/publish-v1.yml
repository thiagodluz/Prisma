name: Publish Prisma 1.0.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.yml

jobs:
  release:
    if: github.repository == 'thiagodluz/Prisma'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          test -n "$sdk_manager"
          yes | "$sdk_manager" --licenses >/dev/null
          "$sdk_manager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify game
        run: npm test
      - name: Build APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | grep 'No errors detected'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/engine.js'
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Prisma-Android.apk
          sha256sum release/Prisma-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-Android-1.0.1
          path: release/Prisma-Android.apk
          if-no-files-found: error
      - name: Publish version 1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 release/Prisma-Android.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Prisma 1.0.1 — Android' --latest \
            --notes-file docs/release-v1-0-1.md
