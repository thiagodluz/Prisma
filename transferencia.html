<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transferir progresso — Prisma</title><style>body{font:17px system-ui;background:#111426;color:#f3edff;max-width:36rem;margin:3rem auto;padding:0 1rem;line-height:1.5}button,input{font:inherit;margin:.5rem 0;padding:.7rem}button{border:0;border-radius:.5rem;background:#bba7ff;color:#171427}a{color:#c6b7ff}</style><h1>Transferir progresso do Prisma</h1><p>No endereço antigo, toque em <strong>Exportar progresso</strong>. No endereço novo, abra esta página e escolha o arquivo para importar.</p><p>O arquivo contém suas partidas, recordes e configurações. Guarde uma cópia antes de importar.</p><button id="export">Exportar progresso</button><p><label for="file">Importar arquivo de progresso:</label><br><input id="file" type="file" accept="application/json,.json"></p><p id="status" role="status"></p><p><a href="./">Voltar ao jogo</a></p><script>
const keys=['prisma.session','prisma.session.zen','prisma.session.classic','prisma.activeMode','prisma.records.zen','prisma.records.classic','prisma.best.zen','prisma.best.classic','prisma.best.endless','prisma.sound','prisma.vibration','prisma.visualStyle','prisma.audio.settings','prisma.zen.settings'];
const status=document.querySelector('#status');
document.querySelector('#export').onclick=()=>{try{const values={};for(const key of keys){const value=localStorage.getItem(key);if(value!==null)values[key]=value}if(!Object.keys(values).length)throw Error('Nenhum progresso encontrado neste navegador.');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'prisma-backup',version:1,values},null,2)],{type:'application/json'}));a.download='prisma-progresso.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='Arquivo exportado. Guarde uma cópia.'}catch(e){status.textContent=e.message}};
document.querySelector('#file').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>1024*1024)throw Error('Arquivo grande demais.');const backup=JSON.parse(await file.text());if(backup.format!=='prisma-backup'||backup.version!==1||!backup.values||typeof backup.values!=='object'||Array.isArray(backup.values))throw Error('Arquivo de progresso inválido.');const entries=Object.entries(backup.values);if(!entries.length||entries.some(([k,v])=>!keys.includes(k)||typeof v!=='string'))throw Error('Conteúdo de progresso inválido.');for(const [k,v] of entries)if(k.startsWith('prisma.session')||k.startsWith('prisma.records.')||k.endsWith('.settings'))JSON.parse(v);if(!confirm('Importar substituirá os dados correspondentes neste navegador. Continue somente se tiver uma cópia do progresso atual.'))return;const before=entries.map(([k])=>[k,localStorage.getItem(k)]);try{for(const [k,v] of entries)localStorage.setItem(k,v)}catch(e){for(const [k,v] of before){if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}throw e}status.textContent='Progresso importado. Volte ao jogo para continuar.'}catch(e){status.textContent='Não foi possível importar: '+e.message}finally{event.target.value=''}};
</script></html>
