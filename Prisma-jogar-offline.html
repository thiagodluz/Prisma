<body>
  <main class="shell">
    <header class="header">
      <div class="brand"><span class="brand-mark">✦</span><div><h1>PRISMA</h1><small>Um instante de brilho</small></div></div>
      <button class="icon-button" id="sound" type="button" aria-label="Desativar sons" title="Som">♫</button>
    </header>

    <section class="hud" aria-label="Progresso da partida">
      <div class="stat"><span>PONTOS</span><strong id="score">0</strong></div>
      <div class="stat stat-center"><span id="mode-label">MODO</span><strong id="level">ZEN</strong></div>
      <div class="stat"><span>MELHOR</span><strong id="best">0</strong></div>
    </section>

    <div class="board-frame">
      <div class="board" id="board" role="grid" aria-label="Tabuleiro de pedras, oito linhas por oito colunas"><p style="grid-column:1/-1;align-self:center;text-align:center;padding:1rem;color:#ddd">Carregando o jogo… Se o tabuleiro continuar vazio, abra o endereço HTTPS no navegador.</p></div>
      <div class="toast" id="toast" aria-live="polite"></div>
    </div>

    <div class="toolbar">
      <button id="shuffle" class="quiet-button" type="button">⤨ <span>Embaralhar</span></button>
      <div class="combo" id="combo" aria-live="polite">Combine três ou mais</div>
      <button id="new-game" class="quiet-button" type="button">↻ <span>Novo jogo</span></button>
    </div>

    <section class="mode-picker" aria-label="Modo de jogo">
      <button class="mode selected" data-mode="zen" type="button"><span class="mode-icon">☾</span><span><strong>Zen</strong><small>Jogue no seu ritmo</small></span></button>
      <button class="mode" data-mode="endless" type="button"><span class="mode-icon">✧</span><span><strong>Endless</strong><small>Suba de nível</small></span></button>
    </section>
    <p class="hint">Toque duas pedras vizinhas ou arraste para trocar.</p>
  </main>
  <script>const SIZE = 8;
const COLORS = 7;
const SPECIALS = ['burst', 'cross', 'spectrum'];
const copy = board => board.map(row => [...row]);
const position = index => [Math.floor(index / SIZE), index % SIZE];

class Game {
  constructor(random = Math.random) {
    this.random = random;
    this.nextId = 1;
    this.board = [];
    this.score = 0;
    this.level = 1;
    this.mode = 'zen';
    this.newGame();
  }

  gem(color = Math.floor(this.random() * COLORS), type = 'normal') {
    return {id: this.nextId++, color: type === 'spectrum' ? null : color, type};
  }

  newGame(mode = this.mode) {
    this.mode = mode;
    this.score = 0;
    this.level = 1;
    this.board = this.freshBoard();
  }

  freshBoard() {
    for (let attempt = 0; attempt < 1000; attempt++) {
      const board = Array.from({length: SIZE}, () => Array(SIZE).fill(null));
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
        const choices = Array.from({length: COLORS}, (_, color) => color).filter(color =>
          !(c >= 2 && board[r][c - 1].color === color && board[r][c - 2].color === color) &&
          !(r >= 2 && board[r - 1][c].color === color && board[r - 2][c].color === color));
        board[r][c] = this.gem(choices[Math.floor(this.random() * choices.length)]);
      }
      if (this.hasMove(board)) return board;
    }
    throw new Error('Não foi possível criar um tabuleiro jogável');
  }

  tile(index, board = this.board) {
    const [r, c] = position(index);
    return board[r]?.[c] ?? null;
  }

  set(index, tile) {
    const [r, c] = position(index);
    this.board[r][c] = tile;
  }

  matches(board = this.board) {
    const runs = [];
    const scan = points => {
      let start = 0;
      while (start < SIZE) {
        let end = start + 1;
        const gem = this.tile(points[start], board);
        while (gem && gem.color !== null && end < SIZE && this.tile(points[end], board)?.color === gem.color) end++;
        if (gem && gem.color !== null && end - start >= 3)
          runs.push({cells: points.slice(start, end), color: gem.color, length: end - start});
        start = end;
      }
    };
    for (let r = 0; r < SIZE; r++) scan(Array.from({length: SIZE}, (_, c) => r * SIZE + c));
    for (let c = 0; c < SIZE; c++) scan(Array.from({length: SIZE}, (_, r) => r * SIZE + c));
    return {cells: [...new Set(runs.flatMap(run => run.cells))], runs};
  }

  adjacent(a, b) {
    return Number.isInteger(a) && Number.isInteger(b) && a >= 0 && b >= 0 && a < SIZE * SIZE && b < SIZE * SIZE &&
      Math.abs(Math.floor(a / SIZE) - Math.floor(b / SIZE)) + Math.abs(a % SIZE - b % SIZE) === 1;
  }

  swap(a, b, board = this.board) {
    const [ar, ac] = position(a), [br, bc] = position(b);
    [board[ar][ac], board[br][bc]] = [board[br][bc], board[ar][ac]];
  }

  hasMove(board = this.board) {
    for (let a = 0; a < SIZE * SIZE; a++) for (const b of [a + 1, a + SIZE]) {
      if (!this.adjacent(a, b)) continue;
      if (this.tile(a, board)?.type === 'spectrum' || this.tile(b, board)?.type === 'spectrum') return true;
      this.swap(a, b, board);
      const found = this.matches(board).cells.length > 0;
      this.swap(a, b, board);
      if (found) return true;
    }
    return false;
  }

  // Connected same-color runs make one special. Prefer the destination of the
  // player's swap; cascades use the lowest matching cell.
  creations(match, preferred = []) {
    const components = [];
    for (const run of match.runs) {
      const overlapping = components.filter(component => component.color === run.color &&
        run.cells.some(cell => component.cells.has(cell)));
      for (const component of overlapping) components.splice(components.indexOf(component), 1);
      const cells = new Set([...run.cells, ...overlapping.flatMap(component => [...component.cells])]);
      components.push({color: run.color, cells, runs: [run, ...overlapping.flatMap(component => component.runs)]});
    }
    return components.flatMap(component => {
      const hasFive = component.runs.some(run => run.length >= 5);
      const intersects = component.runs.length > 1 &&
        component.cells.size < component.runs.reduce((sum, run) => sum + run.length, 0);
      const hasFour = component.runs.some(run => run.length >= 4);
      const type = hasFive ? 'spectrum' : intersects ? 'cross' : hasFour ? 'burst' : null;
      if (!type) return [];
      const candidates = [...component.cells].filter(cell => this.tile(cell)?.type === 'normal');
      if (!candidates.length) return [];
      return [{index: preferred.find(cell => candidates.includes(cell)) ?? Math.max(...candidates),
        type, color: component.color}];
    });
  }

  move(a, b) {
    if (!this.adjacent(a, b)) return {valid: false, events: []};
    this.swap(a, b);
    let match = this.matches();
    const spectrum = [a, b].filter(index => this.tile(index)?.type === 'spectrum');
    if (!match.cells.length && !spectrum.length) {
      this.swap(a, b);
      return {valid: false, events: []};
    }
    const events = [];
    let chain = 0;
    let earned = 0;
    let direct = spectrum.length ? {spectrum, target: spectrum.length === 1 ? (spectrum[0] === a ? b : a) : null} : null;
    while (match.cells.length || direct) {
      chain++;
      const creations = (direct ? [] : this.creations(match, chain === 1 ? [b, a] : []))
        .map(creation => ({...creation, tile: this.gem(creation.color, creation.type)}));
      const protectedCells = new Set(creations.map(creation => creation.index));
      const cleared = new Set(match.cells.filter(index => !protectedCells.has(index)));
      const activated = [];
      const queue = [];
      const seen = new Set();
      const enqueue = index => {
        const tile = this.tile(index);
        if (!protectedCells.has(index) && tile && tile.type !== 'normal' && !seen.has(tile.id)) queue.push(index);
      };
      for (const index of cleared) enqueue(index);
      if (direct) {
        for (const index of direct.spectrum) { cleared.add(index); enqueue(index); }
        if (direct.target !== null) { cleared.add(direct.target); enqueue(direct.target); }
      }
      while (queue.length) {
        const index = queue.shift();
        const tile = this.tile(index);
        if (!tile || seen.has(tile.id)) continue;
        seen.add(tile.id);
        activated.push({index, type: tile.type, id: tile.id});
        const add = cell => {
          if (cell < 0 || cell >= SIZE * SIZE || protectedCells.has(cell) || !this.tile(cell)) return;
          cleared.add(cell);
          enqueue(cell);
        };
        if (tile.type === 'burst') {
          const [r, c] = position(index);
          for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++)
            if (r + dr >= 0 && r + dr < SIZE && c + dc >= 0 && c + dc < SIZE) add((r + dr) * SIZE + c + dc);
        } else if (tile.type === 'cross') {
          const [r, c] = position(index);
          for (let i = 0; i < SIZE; i++) { add(r * SIZE + i); add(i * SIZE + c); }
        } else if (tile.type === 'spectrum') {
          const color = direct?.spectrum.length === 2 ? 'all' :
            direct?.spectrum.includes(index) ? this.tile(direct.target)?.color : this.nearbyColor(index);
          if (color === 'all' || color !== null && color !== undefined) for (let i = 0; i < SIZE * SIZE; i++)
            if (color === 'all' || this.tile(i)?.color === color) add(i);
        }
      }
      events.push({type: 'clear', board: copy(this.board), cells: [...cleared], activated, creations, chain});
      earned += (cleared.size * 20 + creations.length * 80) * chain;
      for (const index of cleared) this.set(index, null);
      for (const creation of creations) this.set(creation.index, creation.tile);
      const falls = Array(SIZE * SIZE);
      for (let c = 0; c < SIZE; c++) {
        const remaining = [];
        for (let r = SIZE - 1; r >= 0; r--) if (this.board[r][c]) remaining.push({tile: this.board[r][c], row: r});
        const missing = SIZE - remaining.length;
        for (let r = SIZE - 1; r >= 0; r--) {
          const existing = remaining[SIZE - 1 - r];
          this.board[r][c] = existing?.tile ?? this.gem();
          falls[r * SIZE + c] = (existing?.row ?? r - missing) * SIZE + c;
        }
      }
      events.push({type: 'fall', board: copy(this.board), falls, chain});
      direct = null;
      match = this.matches();
    }
    this.score += earned;
    if (this.mode === 'endless') this.level = 1 + Math.floor(this.score / 2000);
    let shuffled = false;
    if (!this.hasMove()) {
      this.board = this.freshBoard();
      events.push({type: 'shuffle', board: copy(this.board), chain});
      shuffled = true;
    }
    return {valid: true, events, earned, chain, shuffled};
  }

  nearbyColor(index) {
    const [r, c] = position(index);
    for (let distance = 1; distance < SIZE; distance++)
      for (const next of [r * SIZE + c - distance, r * SIZE + c + distance])
        if (Math.floor(next / SIZE) === r && this.tile(next)?.color != null) return this.tile(next).color;
    return null;
  }

  shuffle() { this.board = this.freshBoard(); }

  restore(saved) {
    const validTile = tile => Number.isInteger(tile) && tile >= 0 && tile < COLORS ||
      tile && typeof tile === 'object' && Number.isInteger(tile.id) && tile.id > 0 &&
      (tile.type === 'spectrum' && tile.color === null ||
        ['normal', 'burst', 'cross'].includes(tile.type) && Number.isInteger(tile.color) && tile.color >= 0 && tile.color < COLORS);
    if (!saved || !['zen', 'endless'].includes(saved.mode) || !Number.isSafeInteger(saved.score) || saved.score < 0 ||
      !Array.isArray(saved.board) || saved.board.length !== SIZE ||
      !saved.board.every(row => Array.isArray(row) && row.length === SIZE && row.every(validTile))) return false;
    const ids = new Set();
    const board = saved.board.map(row => row.map(tile => {
      const gem = typeof tile === 'number' ? this.gem(tile) : {...tile};
      if (ids.has(gem.id)) throw new Error('Pedras duplicadas no save');
      ids.add(gem.id);
      this.nextId = Math.max(this.nextId, gem.id + 1);
      return gem;
    }));
    this.board = board;
    this.mode = saved.mode;
    this.score = saved.score;
    this.level = this.mode === 'endless' ? 1 + Math.floor(this.score / 2000) : 1;
    if (this.matches().cells.length || !this.hasMove()) this.board = this.freshBoard();
    return true;
  }
}



const $ = selector => document.querySelector(selector);
const boardElement = $('#board');
const scoreElement = $('#score');
const bestElement = $('#best');
const levelElement = $('#level');
const modeLabel = $('#mode-label');
const progress = $('#progress');
const progressFill = $('#progress-fill');
const combo = $('#combo');
const toast = $('#toast');
const game = new Game();
const names = ['rubi', 'âmbar', 'sol', 'jade', 'água', 'safira', 'ametista'];
try {
  const saved = JSON.parse(localStorage.getItem('prisma.session'));
  game.restore(saved);
} catch { /* A corrupted or unavailable save starts a new game. */ }
let selected = null;
let pointerStart = null;
let busy = false;
let soundOn = true;
try { soundOn = localStorage.getItem('prisma.sound') !== 'off'; } catch { /* Some local file views deny storage. */ }
let audioContext;

function safeBest(mode) {
  try { return Number(localStorage.getItem('prisma.best.' + mode)) || 0; }
  catch { return 0; }
}

function save() {
  try { localStorage.setItem('prisma.session', JSON.stringify({mode: game.mode, score: game.score, board: game.board})); } catch {}
}

function playTone(chain = 1) {
  if (!soundOn) return;
  try {
    audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume();
    const now = audioContext.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440 * 2 ** ((i * 4 + Math.min(chain, 5) * 2) / 12), now + i * .07);
      gain.gain.setValueAtTime(.0001, now + i * .07);
      gain.gain.exponentialRampToValueAtTime(.05, now + i * .07 + .015);
      gain.gain.exponentialRampToValueAtTime(.0001, now + i * .07 + .19);
      osc.connect(gain).connect(audioContext.destination);
      osc.start(now + i * .07);
      osc.stop(now + i * .07 + .2);
    }
  } catch { /* Audio is optional. */ }
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('visible');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('visible'), 1250);
}

function draw(board = game.board, matched = []) {
  const hits = new Set(matched);
  boardElement.replaceChildren(...board.flatMap((row, r) => row.map((tile, c) => {
    const index = r * SIZE + c;
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell';
    if (index === selected) cell.classList.add('selected');
    if (hits.has(index)) cell.classList.add('matched');
    cell.dataset.index = String(index);
    cell.setAttribute('role', 'gridcell');
    const specialName = {burst: 'Pulso', cross: 'Raio', spectrum: 'Espectro'}[tile.type];
    cell.setAttribute('aria-label', `Linha ${r + 1}, coluna ${c + 1}: ${specialName ? `pedra ${specialName}${tile.color === null ? '' : ` ${names[tile.color]}`}` : names[tile.color]}`);
    cell.dataset.tileId = String(tile.id);
    const mover = document.createElement('span');
    mover.className = 'mover';
    const gem = document.createElement('span');
    gem.className = `gem gem-${tile.color === null ? 'spectrum' : tile.color}${specialName ? ` special special-${tile.type}` : ''}`;
    if (specialName) gem.setAttribute('data-symbol', {burst: '✺', cross: '✦', spectrum: '✶'}[tile.type]);
    mover.append(gem);
    cell.append(mover);
    return cell;
  })));
}

function hud() {
  scoreElement.textContent = game.score.toLocaleString('pt-BR');
  const best = Math.max(game.score, safeBest(game.mode));
  bestElement.textContent = best.toLocaleString('pt-BR');
  try { if (best > safeBest(game.mode)) localStorage.setItem('prisma.best.' + game.mode, String(best)); } catch {}
  levelElement.textContent = game.mode === 'zen' ? 'ZEN' : String(game.level);
  modeLabel.textContent = game.mode === 'zen' ? 'MODO' : 'NÍVEL';
  progress.hidden = game.mode === 'zen';
  progressFill.style.width = `${(game.score % 2000) / 20}%`;
  for (const button of document.querySelectorAll('.mode')) button.classList.toggle('selected', button.dataset.mode === game.mode);
  $('#sound').textContent = soundOn ? '♫' : '♪';
  $('#sound').setAttribute('aria-label', soundOn ? 'Desativar sons' : 'Ativar sons');
}

const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
const reducedMotion = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;

async function animateSwap(a, b, valid) {
  if (reducedMotion()) return;
  const cells = boardElement.querySelectorAll('.cell');
  const first = cells[a]?.getBoundingClientRect();
  const second = cells[b]?.getBoundingClientRect();
  if (!first || !second) return;
  const dx = second.left - first.left, dy = second.top - first.top;
  const options = {duration: valid ? 170 : 260, easing: 'ease-in-out'};
  const paths = valid
    ? [[{transform: 'translate(0, 0)'}, {transform: `translate(${dx}px, ${dy}px)`}],
       [{transform: 'translate(0, 0)'}, {transform: `translate(${-dx}px, ${-dy}px)`}]]
    : [[{transform: 'translate(0, 0)'}, {transform: `translate(${dx}px, ${dy}px)`, offset: .48}, {transform: 'translate(0, 0)'}],
       [{transform: 'translate(0, 0)'}, {transform: `translate(${-dx}px, ${-dy}px)`, offset: .48}, {transform: 'translate(0, 0)'}]];
  const animations = [a, b].map((index, i) => cells[index].querySelector('.mover').animate(paths[i], options));
  await Promise.all(animations.map(animation => animation.finished.catch(() => {})));
}

async function animateFall(falls) {
  if (reducedMotion()) return;
  const cells = boardElement.querySelectorAll('.cell');
  const pitch = cells[SIZE].getBoundingClientRect().top - cells[0].getBoundingClientRect().top;
  const animations = [];
  for (let index = 0; index < falls.length; index++) {
    const distance = (Math.floor(falls[index] / SIZE) - Math.floor(index / SIZE)) * pitch;
    if (!distance) continue;
    const spawned = falls[index] < 0;
    animations.push(cells[index].querySelector('.mover').animate(
      [{transform: `translateY(${distance}px)`, opacity: spawned ? .45 : 1},
       {transform: 'translateY(0)', opacity: 1}],
      {duration: Math.min(400, 210 + Math.abs(distance / pitch) * 27), easing: 'cubic-bezier(.2, .78, .24, 1)', fill: 'both'}));
  }
  await Promise.all(animations.map(animation => animation.finished.catch(() => {})));
}

async function attempt(a, b) {
  if (busy) return;
  selected = null;
  const result = game.move(a, b);
  busy = true;
  boardElement.classList.add('busy');
  await animateSwap(a, b, result.valid);
  if (!result.valid) {
    draw();
    boardElement.classList.remove('busy');
    busy = false;
    return;
  }
  for (const frame of result.events) {
    draw(frame.board, frame.type === 'clear' ? frame.cells : []);
    if (frame.type === 'clear') {
      playTone(frame.chain);
      combo.textContent = frame.activated.some(effect => effect.type === 'spectrum') ? 'Explosão de cores!' :
        frame.activated.length ? 'Reação em cadeia!' :
        frame.creations.length ? 'Nova pedra especial!' :
        frame.chain > 1 ? `Cascata ×${frame.chain}!` : 'Boa combinação!';
      if (!reducedMotion()) await pause(frame.activated.length ? 250 : 200);
    } else if (frame.type === 'fall') await animateFall(frame.falls);
    else if (frame.type === 'shuffle' && !reducedMotion()) await pause(120);
  }
  draw();
  hud();
  save();
  showToast(`+${result.earned.toLocaleString('pt-BR')}${result.chain > 1 ? ` · ${result.chain} cascatas` : ''}`);
  if (result.shuffled) combo.textContent = 'Novas jogadas disponíveis';
  else setTimeout(() => { if (!busy) combo.textContent = 'Combine três ou mais'; }, 1500);
  boardElement.classList.remove('busy');
  busy = false;
}

function handleIndex(index) {
  if (busy || index < 0) return;
  if (selected === null) selected = index;
  else if (selected === index) selected = null;
  else if (game.adjacent(selected, index)) { attempt(selected, index); return; }
  else selected = index;
  draw();
}

boardElement.addEventListener('pointerdown', event => {
  const cell = event.target.closest('.cell');
  if (!cell || busy) return;
  pointerStart = {index: Number(cell.dataset.index), x: event.clientX, y: event.clientY};
});
boardElement.addEventListener('pointerup', event => {
  if (!pointerStart || busy) return;
  const start = pointerStart;
  pointerStart = null;
  const dx = event.clientX - start.x, dy = event.clientY - start.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) return handleIndex(start.index);
  const step = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : -1) : (dy > 0 ? SIZE : -SIZE);
  const end = start.index + step;
  if (game.adjacent(start.index, end)) attempt(start.index, end);
});
boardElement.addEventListener('pointercancel', () => { pointerStart = null; });
boardElement.addEventListener('keydown', event => {
  const index = Number(event.target.closest('.cell')?.dataset.index);
  if (!Number.isInteger(index)) return;
  if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); handleIndex(index); }
});

$('#shuffle').addEventListener('click', () => {
  if (busy) return;
  selected = null;
  game.shuffle();
  draw();
  save();
  showToast('Tabuleiro embaralhado');
});
$('#new-game').addEventListener('click', () => {
  if (busy) return;
  selected = null;
  game.newGame();
  combo.textContent = 'Combine três ou mais';
  draw(); hud(); save();
});
document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => {
  if (busy || game.mode === button.dataset.mode) return;
  selected = null;
  game.newGame(button.dataset.mode);
  combo.textContent = 'Combine três ou mais';
  draw(); hud(); save();
}));
$('#sound').addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem('prisma.sound', soundOn ? 'on' : 'off'); } catch {}
  hud();
});

draw(); hud();

</script>
</body>
</html>
