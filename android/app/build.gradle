plugins { id 'com.android.application' }

android {
    namespace 'com.thiagodluz.prisma'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thiagodluz.prisma'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Pack the same web files used by the hosted game. The APK never fetches them.
tasks.register('syncPrismaAssets', Copy) {
    from('../..') {
        include 'index.html', 'style.css', 'app.js', 'engine.js', 'zen.js', 'sound.js'
        include 'gem-atlas.webp', 'burst-atlas.webp', 'cross-atlas.webp'
        include 'spectrum-gem.webp', 'prisma-bg.jpg', 'icon.svg'
        include 'icon-192.png', 'icon-512.png', 'manifest.webmanifest'
    }
    into layout.buildDirectory.dir('generated/prismaAssets')
}
android.sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/prismaAssets')]
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('Assets')) dependsOn tasks.named('syncPrismaAssets')
}
